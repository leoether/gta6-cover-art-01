<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Cover Studio — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Sunset Cover Studio</h1>
    <p class="tagline">Your photo + a caption, made into a multi-panel sunset cover.</p>

    <fieldset>
      <legend>Photos</legend>
      <label>Your photo 1 <input id="fileA" type="file" accept="image/*"></label>
      <label>Your photo 2 <input id="fileB" type="file" accept="image/*"></label>
      <label>Your photo 3 <input id="fileC" type="file" accept="image/*"></label>
      <p class="hint">Or use the free samples: Pier and Boulevard are bundled with the app.</p>
    </fieldset>

    <fieldset>
      <legend>Panels</legend>
      <label>Panel
        <select id="panelPick">
          <option value="0">1 — Hero (top)</option>
          <option value="1">2 — Bottom left</option>
          <option value="2">3 — Bottom right</option>
        </select>
      </label>
      <label>Photo in this panel
        <select id="panelPhoto">
          <option value="pier">Sample: Pier</option>
          <option value="boulevard">Sample: Boulevard</option>
          <option value="A">Your photo 1</option>
          <option value="B">Your photo 2</option>
          <option value="C">Your photo 3</option>
          <option value="none">Empty (sunset only)</option>
        </select>
      </label>
      <label>Zoom <input id="zoom" type="range" min="0.6" max="3" step="0.05" value="1"></label>
      <label>Move left / right <input id="offX" type="range" min="-50" max="50" step="1" value="0"></label>
      <label>Move up / down <input id="offY" type="range" min="-50" max="50" step="1" value="0"></label>
    </fieldset>

    <fieldset>
      <legend>Words &amp; style</legend>
      <label>Caption <input id="caption" type="text" maxlength="40" value="Sunset Heist"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="VICE CITY &bull; 2026"></label>
      <label>Colour grade
        <select id="grade">
          <option value="sunset">Sunset — orange &amp; magenta</option>
          <option value="neon">Neon Nights — pink &amp; cyan</option>
          <option value="noir">Noir — teal &amp; steel</option>
          <option value="bubblegum">Bubblegum — pink &amp; violet</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend>Export</legend>
      <div class="sizes" role="group" aria-label="Export size">
        <button id="sizeSquare" type="button" class="sizeBtn on">1080 &times; 1080</button>
        <button id="sizeTall" type="button" class="sizeBtn">1080 &times; 1350</button>
        <button id="sizeWide" type="button" class="sizeBtn">1920 &times; 1080</button>
      </div>
      <button id="export" type="button" class="exportBtn">Export PNG</button>
      <p id="status" role="status">Pick a photo, tweak a panel, export.</p>
    </fieldset>
  </section>

  <section class="preview" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
    <p class="previewNote">Live preview — what you see is what the PNG holds.</p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
